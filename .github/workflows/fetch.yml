name: build-voice-apk
on:
  push:
    branches: [tools-fetch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice-offline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: build unsigned release (no key.properties -> unsigned)
        run: |
          set -eux
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/hermes-voice-unsigned.apk
          echo "$(git rev-parse HEAD)" > out/SOURCE_COMMIT
          sha256sum out/*.apk > out/SHA256SUMS
          cat out/SHA256SUMS out/SOURCE_COMMIT
          cd out && git init -q && git checkout -q -b voice-apk && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "unsigned voice apk"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-apk
